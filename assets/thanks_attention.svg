<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Спасибо за внимание">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="50%" stop-color="#123b6b"/>
      <stop offset="100%" stop-color="#0f6b6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="1220" cy="130" r="120" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="180" cy="700" r="170" fill="#ffffff" fill-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="120" y="200" width="1160" height="400" rx="32" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
  </g>

  <text x="700" y="430" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="98" font-weight="700" fill="#ffffff">
    Спасибо за внимание!
  </text>
</svg>
